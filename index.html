<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sentence Sense — Build stronger sentences.</title>
  <meta name="description" content="Sentence Sense helps third-grade students understand how a sentence works: verbs, subjects, nouns and adjectives.">
  <meta name="theme-color" content="#123A6B">
  <link rel="icon" type="image/png" href="assets/images/favicon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700;800&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>

  <a class="skip-link" href="#main">Skip to content</a>

  <div class="app-shell" id="main">

    <!-- ============================================================
         HOME — CHOOSE THE SKILL FIRST.

         Build 1.4.0 retired the mode-first portal. Home now shows the
         brand, one short purpose statement, and exactly four skill
         cards. Nothing else: no progress, no achievements, no settings,
         no profile, no goal widget, no points, no streak.
         ============================================================ -->
    <section class="screen screen-home" id="screen-home" aria-labelledby="home-heading" hidden>

      <!-- The hero band. The photograph is optional by design: if
           assets/images/sentence-sense-hero.png is absent the band falls
           back to a clean tinted panel and Home still reads correctly.
           See SENTENCE-SENSE-HANDOFF.md section 5. -->
      <header class="home-hero">
        <div class="hero-text">
          <p class="brand">
            <span class="brand-mark" aria-hidden="true">
              <svg viewBox="0 0 24 24" focusable="false">
                <path d="M12 6.6C10 4.9 7.3 4.4 4.2 4.9a1 1 0 0 0-.8 1v11.4a1 1 0 0 0 1.2 1c2.6-.4 5 0 7.4 1.8 2.4-1.8 4.8-2.2 7.4-1.8a1 1 0 0 0 1.2-1V5.9a1 1 0 0 0-.8-1c-3.1-.5-5.8 0-7.8 1.7z M12 6.6v13.5"
                      fill="none" stroke="currentColor" stroke-width="1.7"
                      stroke-linecap="round" stroke-linejoin="round"/>
              </svg>
            </span>
            <span class="brand-name"><span class="bn-1">Sentence</span> <span class="bn-2">Sense</span></span>
          </p>
          <h1 id="home-heading" class="hero-title" tabindex="-1">Build stronger sentences.</h1>
          <p class="hero-sub">Choose a skill to start learning.</p>
        </div>
        <!-- The reserved image area. Until an approved photograph exists it
             shows the product's own idea: one sentence read plainly, then the
             same sentence with its parts named. Built by js/app.js from
             SS_LEARN_CONTENT.heroDemo. -->
        <div class="hero-image">
          <div class="hero-demo" id="hero-demo"></div>
        </div>
      </header>

      <div class="home-main">
        <h2 class="section-title">Choose a skill</h2>

        <!-- The four skill cards are built from js/data/learn-content.js
             by js/app.js. Adding a skill is a content change. -->
        <ul class="skill-grid" id="skill-grid"></ul>
      </div>

      <p class="home-standards">Aligned with Georgia Grade 3 ELA Standards</p>
    </section>


    <!-- ============================================================
         SKILL — ONE SHARED SCREEN FOR ALL FOUR SKILLS.
         Title, clue and the three activities are all filled by
         js/app.js from content. There is no per-skill layout.
         ============================================================ -->
    <section class="screen screen-skill" id="screen-skill" aria-labelledby="skill-heading" data-topic="" hidden>
      <header class="app-header">
        <button type="button" class="nav-btn nav-back" id="skill-back">
          <span aria-hidden="true">&larr;</span> Home
        </button>
        <span class="header-tag" id="skill-tag"></span>
        <button type="button" class="nav-btn nav-home" id="skill-home">Home</button>
      </header>

      <div class="skill-body">
        <div class="skill-intro">
          <h2 id="skill-heading" class="skill-title" tabindex="-1"></h2>
          <p class="skill-ask-line" id="skill-ask-line"></p>
        </div>

        <div class="activity-list" id="activity-list"></div>
      </div>
    </section>


    <!-- ============================================================
         LEARN — the shared four-state lesson.
         WHAT IS IT? / HOW DO I FIND IT? / SHOW ME / LET ME TRY
         ============================================================ -->
    <section class="screen screen-learn" id="screen-learn" aria-labelledby="learn-heading" data-topic="" hidden>
      <header class="app-header">
        <button type="button" class="nav-btn nav-back" id="learn-back">
          <span aria-hidden="true">&larr;</span> Back
        </button>
        <span class="header-tag" id="learn-skill-tag"></span>
        <button type="button" class="nav-btn nav-home" id="learn-home">Home</button>
      </header>

      <div class="activity-body">
        <ol class="step-line" id="learn-steps" aria-label="Lesson steps"></ol>

        <div class="stage" id="learn-stage">
          <h2 class="activity-title" id="learn-heading" tabindex="-1"></h2>
          <div class="lesson-content" id="learn-content"></div>

          <div class="try-block" id="learn-try" hidden>
            <div class="sentence-host" id="try-sentence"></div>
            <p class="question" id="try-question"></p>
            <div class="choices" id="try-choices" role="group" aria-labelledby="try-question"></div>
            <p class="answer-feedback" id="try-feedback" role="status" aria-live="polite" hidden></p>
          </div>
        </div>

        <div class="controls" id="learn-controls">
          <button type="button" class="nav-btn" id="learn-prev">
            <span aria-hidden="true">&larr;</span> Back
          </button>
          <button type="button" class="btn btn-next" id="learn-next">Next</button>
        </div>

        <div class="done-panel" id="learn-done" hidden>
          <p class="done-mark" aria-hidden="true">&#127881;</p>
          <h2 class="done-title" id="learn-done-title" tabindex="-1"></h2>
          <p class="done-recap" id="learn-done-recap"></p>
          <div class="done-buttons">
            <button type="button" class="btn btn-next" id="learn-done-practice"></button>
            <button type="button" class="nav-btn" id="learn-done-again">Learn this again</button>
            <button type="button" class="nav-btn" id="learn-done-skill">Back to skill</button>
            <button type="button" class="nav-btn" id="learn-done-home">Home</button>
          </div>
        </div>
      </div>
    </section>


    <!-- ============================================================
         PRACTICE — the shared question engine.
         A skill reaches this screen only if its content carries a
         question bank. Everything inside is filled by js/practice.js.
         ============================================================ -->
    <section class="screen screen-practice" id="screen-practice" aria-labelledby="practice-heading" data-topic="" hidden>
      <header class="app-header">
        <button type="button" class="nav-btn nav-back" id="practice-back">
          <span aria-hidden="true">&larr;</span> Back
        </button>
        <span class="header-tag" id="practice-skill-tag"></span>
        <button type="button" class="nav-btn nav-home" id="practice-home">Home</button>
      </header>

      <div class="activity-body">

        <div id="practice-stage-wrap">
          <div class="practice-head">
            <p class="practice-count" id="practice-count"></p>
            <p class="practice-stage" id="practice-stage"></p>
            <p class="practice-stage-desc" id="practice-stage-desc"></p>
            <div class="practice-track"><span class="practice-bar" id="practice-bar"></span></div>
          </div>

          <div class="stage">
            <h2 class="activity-title question-title" id="practice-heading" tabindex="-1"></h2>
            <div class="sentence-host" id="practice-sentence"></div>
            <div class="choices" id="practice-choices" role="group" aria-labelledby="practice-heading"></div>
            <p class="answer-feedback" id="practice-feedback" role="status" aria-live="polite" hidden></p>
          </div>
        </div>

        <div class="controls" id="practice-controls">
          <button type="button" class="nav-btn" id="practice-clue">Need a clue?</button>
          <button type="button" class="btn btn-next" id="practice-next">Next</button>
        </div>

        <div class="done-panel" id="practice-milestone" hidden>
          <p class="done-mark" id="pm-mark" aria-hidden="true"></p>
          <h2 class="done-title" id="pm-title" tabindex="-1"></h2>
          <p class="done-recap" id="pm-line"></p>
          <p class="done-next" id="pm-next"></p>
          <div class="done-buttons">
            <button type="button" class="btn btn-next" id="pm-continue">Keep going</button>
            <button type="button" class="nav-btn" id="pm-skill">Back to skill</button>
            <button type="button" class="nav-btn" id="pm-home">Home</button>
          </div>
        </div>

        <div class="done-panel" id="practice-done" hidden>
          <p class="done-mark" aria-hidden="true">&#127881;</p>
          <h2 class="done-title" id="practice-done-title" tabindex="-1"></h2>
          <p class="done-recap" id="practice-done-recap"></p>
          <div class="done-buttons">
            <button type="button" class="btn btn-next" id="practice-done-again">Practise again</button>
            <button type="button" class="nav-btn" id="practice-done-skill">Back to skill</button>
            <button type="button" class="nav-btn" id="practice-done-home">Home</button>
          </div>
        </div>

      </div>
    </section>


    <!-- ============================================================
         COMING NEXT — the honest placeholder.
         Used by Practice for skills with no approved bank, and by Test
         for every skill. It never imitates the activity it stands in
         for, and it always offers the thing that does exist.
         ============================================================ -->
    <section class="screen screen-soon" id="screen-soon" aria-labelledby="soon-heading" data-topic="" hidden>
      <header class="app-header">
        <button type="button" class="nav-btn nav-back" id="soon-back">
          <span aria-hidden="true">&larr;</span> Back
        </button>
        <span class="header-tag" id="soon-tag"></span>
        <button type="button" class="nav-btn nav-home" id="soon-home">Home</button>
      </header>

      <div class="activity-body">
        <div class="stage soon-stage">
          <h2 class="activity-title" id="soon-heading" tabindex="-1"></h2>
          <p class="soon-note" id="soon-note"></p>
          <div class="done-buttons">
            <button type="button" class="btn btn-next" id="soon-learn"></button>
          </div>
        </div>
      </div>
    </section>

    <p class="build-badge" id="build-badge" aria-label="Application version"></p>

  </div>

  <!-- Load order matters. Content, then the shared sentence renderer the
       components depend on, then the two activity components, then the
       shell -- js/app.js calls init() on both and must load last. -->
  <script src="js/data/learn-content.js"></script>
  <script src="js/sentence.js"></script>
  <script src="js/learn.js"></script>
  <script src="js/practice.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
